name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-macos:
    name: Verify macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check and test
        run: |
          npm run typecheck
          npm test

      - name: Compile the native helper (universal)
        run: npm run build:native

      - name: Helper protocol smoke test
        run: npm run test:helper

      - name: Create a throwaway signing identity
        run: |
          scripts/create-signing-identity.sh
          scripts/create-signing-identity.sh
          security find-identity -p codesigning

      - name: Package the app
        run: |
          npm run build
          npx electron-builder --mac --dir --publish never

      - name: Inspect the packaged app
        run: |
          APP="$(find release -maxdepth 2 -name 'Yap.app' -type d | head -1)"
          echo "App: $APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Identifier|Authority|Signature|Runtime|flags'
          echo "Designated requirement:"
          codesign -d -r- "$APP" 2>&1 | tail -1
          codesign --verify --deep --strict "$APP"
          lipo -info "$APP/Contents/Resources/native/yap-helper"
          codesign -dv "$APP/Contents/Resources/native/yap-helper" 2>&1 | grep -E 'Authority|Signature'
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$APP/Contents/Info.plist"
          du -sh "$APP"
          du -sh "$APP/Contents/Resources/app.asar" "$APP/Contents/Resources/app.asar.unpacked" 2>/dev/null || true

      - name: Packaged helper still answers
        run: |
          APP="$(find release -maxdepth 2 -name 'Yap.app' -type d | head -1)"
          node scripts/helper-smoke-test.mjs "$APP/Contents/Resources/native/yap-helper"

      - name: Local Whisper stack loads from the package
        run: |
          APP="$(find release -maxdepth 2 -name 'Yap.app' -type d | head -1)"
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/Yap" -e "
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const entry = path.join(process.argv[1], 'Contents/Resources/app.asar/node_modules/@huggingface/transformers/dist/transformers.node.mjs');
            import(pathToFileURL(entry).href).then((m) => {
              if (typeof m.pipeline !== 'function') throw new Error('pipeline missing');
              console.log('transformers', m.env.version, 'loaded');
            }).catch((error) => { console.error(error); process.exit(1); });
          " "$APP"

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build app
        run: npm run build

      - name: Build native helper (C++)
        run: npm run build:native

      - name: Package
        run: npx electron-builder --win --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*.exe
            release/*.zip
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Release
    needs: [verify-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.yml' -o -name '*.blockmap' \) -exec mv {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          body: |
            ## Downloads

            **Windows:** install the NSIS installer below; updates land automatically on future releases.

            **macOS:** a signed build is uploaded manually after each release. If you do not see a `.dmg` asset yet, check back shortly or open the issue tracker.
          files: |
            release/*.exe
            release/*.zip
            release/latest.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
